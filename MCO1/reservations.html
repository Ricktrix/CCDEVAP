<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Reservations</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">SkyJet</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="booking.html">Book</a>
                <a class="nav-link active" href="reservations.html">Reservations</a>
            </div>
        </div>
    </nav>

    <main class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="fw-bold mb-0">My Reservations</h2>
            <a href="booking.html" class="btn btn-primary">New Booking</a>
        </div>
        <div class="row g-2 mb-3">
            <div class="col-md-6">
                <input id="search-reservation" class="form-control" placeholder="Search by reference or name">
            </div>
            <div class="col-md-3">
                <select id="filter-status" class="form-select">
                    <option>All</option>
                    <option>Confirmed</option>
                    <option>Pending</option>
                    <option>Cancelled</option>
                </select>
            </div>
        </div>
        <div class="table-responsive shadow-sm rounded">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                    <tr>
                        <th>Ref</th><th>Name</th><th>Route</th><th>Seat</th><th>Status</th><th>Price</th><th>Actions</th>
                    </tr>
                </thead>
                <tbody id="reservations-container"></tbody>
            </table>
        </div>
    </main>

    <div class="modal fade" id="viewDetailsModal">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header"><h5 class="modal-title">Reservation Details</h5></div>
                <div class="modal-body">
                    <p><strong>Ref:</strong> <span id="modal-ref"></span></p>
                    <p><strong>Name:</strong> <span id="modal-name"></span></p>
                    <p><strong>Flight:</strong> <span id="modal-flight"></span></p>
                    <p><strong>Seat:</strong> <span id="modal-seat"></span></p>
                    <p><strong>Meal:</strong> <span id="modal-meal"></span></p>
                    <p><strong>Status:</strong> <span id="modal-status"></span></p>
                    <p><strong>Total:</strong> <span id="modal-total"></span></p>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="editReservationModal">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header"><h5 class="modal-title">Edit Reservation</h5></div>
                <div class="modal-body">
                    <input id="edit-fullName" class="form-control mb-2" placeholder="Full Name">
                    <select id="edit-meal" class="form-select">
                        <option>Standard</option><option>Vegetarian</option><option>Vegan</option><option>Halal</option>
                    </select>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button id="btn-save-edit" class="btn btn-primary">Save Changes</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/data.js"></script>
    <script src="js/reservations.js"></script>
</body>
</html>
